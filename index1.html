
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link rel="stylesheet" href="assets1/css/style.min.css">
    <link rel="stylesheet" href="assets1/css/style-black.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
</head>
<body>

    <div class="fixed-navbar">
        <div class="header1">
            <div class="lights-container">
                <a class="traffic-light red"></a>
                <a class="traffic-light yellow"></a>
                <a class="traffic-light green"></a>
            </div>
            <header class="header">
                <a href="index1.html" class="logo"><i class="ico mdi mdi-cube-outline"></i>Diabetes visualization system</a>
                <!-- /.user -->
            </header>
            
        </div>
    </div>
    <!-- 整体 -->
    <div class="mainbox">
        <!-- 左侧模块 -->
        <div class="parllel-times" style="width: 50%; height: 100%;">
            <!-- <button id="toggleInformationButton">▼  Unfold Information  ▲</button> -->
            <!-- 患者详细信息 -->
            <div class="information" style="width: 100%;height: 40%;">
                <div id="sicker" style="width: 100%;height: 100%;">
                    <table id="example" class="display" style="width:100%;height: 100%;">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Gender</th>
                                <th>Age</th>
                                <th>BMI</th>
                                <th>Duration of diabetes</th>
                                <th>Hypoglycemia</th>
                                <th>Vascular Complications</th>
                                <th>Comorbidities</th>
                            </tr>
                        </thead>
                        <tbody id="patients-data">
                        </tbody>
                    </table>
                </div>
            </div>
        
            <!-- 下方患者分层模块 -->
            <div class="p-b" style="width: 100%; height: 60%;">
                <!-- 降维散点图 -->
                <div id="scatterChart" style="width: 50% ;height: 100%;"></div>
                <!-- 雷达图 -->
                <div class="radar" style="height:100%;width: 50%;">
                    <!-- 有并发症患者 -->
                    <div id="radius" style="height: 50%;width: 100%;"></div>
                    <!-- 无并发症患者 -->
                    <div id="radius-none" style="height: 50%;width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- 右侧模块 -->
        <div class="information-T2G" style="height: 100%;width: 50%;">
            <!-- 平行坐标图(修改为Bar) -->
            <div class="parllel" id="parallel-container" style="height: 40%;width: 100%;"></div>

            <!-- T2G模块 -->
            <div class="T2G-setting" style="height: 20%; width: 100%;">
                <button id="toggleButton">Parameters Setting</button>
                <!-- <textarea id="foldableContent" class="editable-textarea">
                    T2GFormer(n_layers=3,d_token=512,n_heads=8,d_ffn_factor=4,attention_dropout=0.1,ffn_dropout=0.1462394754853018,
                                residual_dropout=0,activation='reglu',prenormalization=True,initialization='kaiming',kv_compression=None,kv_compression_sharing=None
                                ,d_out=3,d_numerical=12,categories=[2,2,2],token_bias=True)
                </textarea> -->
                <div id="foldableContent" >
                    <style>
                        table {
                            width: 100%;
                        }
                        table, th, td {
                            text-align: center;
                        }
                        #model-setting1, #model-setting2 {
                            max-width: 100%;
                            overflow-x: auto;
                        }
                    </style>
                    <!-- 第一行设置参数 -->
                    <table id="model-setting1" style="margin:20px;">
                        <thead>
                            <tr>
                                <th>n_layers</th>
                                <th>d_token</th>
                                <th>n_heads</th>
                                <th>attention_dropout</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <input type="text" id="n_layers" value="3"></input>
                                    <button id="n_layers-inc" style="color: black;">+</button>
                                    <button id="n_layers-dec" style="color: black;">-</button>
                                </td>
                                <td>
                                    <input id="d_token" value="64"></input>
                                    <button id="d_token-inc" style="color: black;">+</button>
                                    <button id="d_token-dec" style="color: black;">-</button>
                                </td>
                                <td>
                                    <input type="text" id="n_heads" value="2"></input>
                                    <button id="n_heads-inc" style="color: black;">+</button>
                                    <button id="n_heads-dec" style="color: black;">-</button>
                                </td>
                                <td>
                                    <input type="text" id="attention_dropout" value="0.2"></input>
                                    <button id="attention_dropouts-inc" style="color: black;">+</button>
                                    <button id="attention_dropout-dec" style="color: black;">-</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- 第二行设置参数 -->
                    <table id="model-setting2" style="margin: 10px;">
                        <thead>
                            <tr>
                                <th>Residual_dropout</th>
                                <th>Activation</th>
                                <th>Prenormalization</th>
                                <th>Initialization</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <input id="Residual_dropout" value="0.0"></input>
                                    <button id="Residual_dropout-inc" style="color: black;">+</button>
                                    <button id="Residual_dropout-dec" style="color: black;">-</button>
                                </td>
                                <td>
                                    <!-- <input type="text" id="Activation" value="relu"></input> -->
                                    <form action="" id="Activation">
                                        <select name="Activation" style="color: black;">
                                        <option value="Relu" selected>Relu</option>
                                        <option value="Sigmoid">Sigmoid</option>
                                        <option value="Tanh">Tanh</option>
                                        <option value="ELU">ELU</option>
                                        </select>
                                    </form>
                                </td>
                                <td>
                                    <!-- <input type="text" id="Prenormalization" value="false"></input> -->
                                    <form action="" id="Prenormalization">
                                        <select name="Prenormalization" style="color: black;">
                                        <option value="false" style="color: black;">False</option>
                                        <option value="true" style="color: black;">True</option>
                                        </select>
                                    </form>
                                </td>
                                <td>
                                    <!-- <input type="text" id="Initialization" value="kaiming"></input> -->
                                    <form action="" id="Initialization">
                                        <select name="Initialization" style="color: black;">
                                        <option value="kaiming" selected>kaiming</option>
                                        <option value="Xavier">Xavier</option>
                                        </select>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <button id="saveButton" onclick="saveParameters()" > Execute </button>
            </div>

            <!-- 特征图和血糖图 -->
            <div id="csp" style="height: 40%; width: 100%;">
                <!-- 特征图 -->
                <div class="T2G" id="t2gform" style="width: 50%;"></div>
                <!-- 血糖箱线图 -->
                <div id="times" style="display: flex; flex-direction: column; width: 50%;">
                    <!-- 血糖箱线图 -->
                    <div id="boxplotChart" style="width: 100%; height: 60%;margin-top: 5%;margin-bottom: -5%;margin-left: 1%;"></div>
                    <!-- 每日血糖散点图 -->
                    <div id="scatterplotChart" style="width: 100%; height: 60%;margin-top: 5%; margin-bottom: -15%;margin-left: 1%;"></div>  
                </div>
            </div>

        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="assets1/js/ecStat.min.js"></script>
    <script src="assets1/scripts/echarts.js"></script>
    <script src="assets1/scripts/dataTool.min.js"></script>
    <script src="./assets1/scripts/g2.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
	<script src="assets1/plugin/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets1/js/flod.js"></script>
    <script type='module' src="assets1/js/information.js"></script>
    <script src="./assets1/scripts/d3-ForceEdgeBundling.js"></script>
    <script src="./assets1/scripts/d3.KernelEdgeBundling.js"></script>
    <script src="./assets1/js/parallel1.js"></script>
    <script src="./assets1/js/times2.js"></script>

    <script src="./assets1/js/graphs.js"></script>
    <script src="./assets1/js/LE2.js"></script>
    <script src="./assets1/js/rad.js"></script>

</body>
</html>
